# LibreLane RTL-to-GDSII of the bare core, Sky130 (CLAUDE.md §6.4, run #1).
# Closes at 35 ns: 0 setup/hold violations at all 9 signoff corners.
# Run with `make asic`, which supplies VERILOG_FILES (every .sv under rtl/,
# found recursively) and runs this inside LibreLane's nix-shell.
#
# The core alone, hardened as a block: its memory ports are the block's pins,
# no pads, no SRAM macros. The register file is flip-flops (1024 of them):
# the simplest mapping, and the area it costs is part of the result.

DESIGN_NAME: riscv_core
CLOCK_PORT: clk_i

# The slang frontend: Yosys 0.62's own reader rejects `parameter string`
# (rtl/top/arty_a7_top.sv), and every .sv under rtl/ is read; slang
# elaborates only DESIGN_NAME's hierarchy.
USE_SLANG: true

# 35 ns (28.6 MHz). Inputs arrive and outputs must be ready 20% of the
# period from the edge (LibreLane's default IO_DELAY_CONSTRAINT): the
# memories sit outside the block. At 25 ns the slow corner fails on the
# fetch-address output (imem_addr_o): 21.9 ns of logic at ss against 19.75 ns
# required; 35 ns leaves 27.75 ns.
CLOCK_PERIOD: 35

# Keep clock delay cells out of the netlist. Without this the resizer used
# clkdlybuf4s25_1 (1.2-2.4 ns per stage at ss) as an ordinary buffer: 1,431
# of them for fanout and I/O, seven on the worst path, and the slow corner
# failed at both 25 ns (-4.68 ns) and 35 ns (-0.97 ns). Hold repair uses
# dlygate4sd3_1, which stays available.
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*

FP_CORE_UTIL: 40

# Global routing reserves less of each edge's capacity than the 0.30
# default: with the delay cells excluded, global routing overflowed by one
# edge on met2 (of 145k) and OpenROAD suggested 0.26 (GRT-0704). Detailed
# routing and DRC signoff check the result.
GRT_ADJUSTMENT: 0.26

# Repair and optimize for the worst setup corner (slow, max parasitics), the
# worst hold corner (fast, min parasitics) and typical. By default only
# typical is optimized and the others merely checked at signoff: the first
# run met timing at typical (+7.75 ns) but failed by 4.7 ns at max_ss, with
# 2805 max-slew violations there.
PNR_CORNERS:
  - nom_tt_025C_1v80
  - max_ss_100C_1v60
  - min_ff_n40C_1v95
