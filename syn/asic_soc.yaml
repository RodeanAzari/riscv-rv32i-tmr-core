# Floorplan, by hand (the Classic flow has no macro placer): a 6000 x 5200
# um die. Main RAM 0-13 in the top two rows, A 0-7 and W 0-5 in the bottom
# two, C 0-14 in three columns of five (two left, one right), and a fourth
# column (right) of W 7, W 6, C 15, main 14, main 15 from the bottom; the
# logic in the centre, about 3100 x 2630 um. Port 0 (the bus side, rw) has
# its pins on each macro's bottom and left edges, port 1 (read) on its top
# and right, so every macro gets channels of 100-150 um on all sides.
# Coordinates generated once (783.1 um pitch in a row, 150 um channels between
# rows, 120 um between column macros), checked for overlap and clearance.
FP_SIZING: absolute
DIE_AREA: [0, 0, 6000, 5200]

# The macros' power pins (vccd1, vssd1) on the core's nets, VPWR and VGND.
PDN_MACRO_CONNECTIONS:
  - "u_soc.*u_sram VPWR VGND vccd1 vssd1"

# As run #1: optimize at the worst setup, worst hold and typical corners.
PNR_CORNERS:
  - nom_tt_025C_1v80
  - max_ss_100C_1v60
  - min_ff_n40C_1v95

# Post-route STA loads a ~400 MB SPEF per corner; unset, all 9 corners run at
# once (one per CPU thread) and ran WSL out of memory twice (2026-11-12).
STA_THREADS: 2

# Timing closure on a 6 x 5 mm die (first full run, 2026-11-13: hold -0.76 ns
# at tt, -1.48 ns at ss; setup -3.1 ns at ss; 78k-91k max-slew violations at
# ss). The SRAM clock branch had one buffer driving ~1 pF (5 SRAMs) through a
# long unbuffered wire, so the SRAM clocks arrived ~1.8 ns after the
# flip-flops'. Post-CTS hold repair gave up (10,458 buffers inserted).
# - Long wires get repeaters in design repair (the default 0 inserts none).
DESIGN_REPAIR_MAX_WIRE_LENGTH: 800
# - Clock wires are bounded and the SRAM branch has fewer sinks per buffer.
CTS_CLK_MAX_WIRE_LENGTH: 400
CTS_MACRO_CLUSTERING_SIZE: 4
# - Setup and hold repaired again on global-route parasitics, with hold margin
#   for detailed routing's shift (0.05 left -0.43 ns at SRAM inputs, 2026-11-14).
#   The shift is the clock: flop clock latency is ~10 ns at ss and grows ~28%
#   from the global-route estimate to extracted parasitics (10.35 -> 13.25 ns,
#   40 ns run), which moves hold skew by ~0.5 ns (nom_tt +0.10 -> -0.39 ns).
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.5
# - That margin touches ~19k endpoints; the incremental reroute of the hold
#   buffers then stopped on GRT-0232 (local congestion) although the global
#   route used 18% with no overflow (2026-11-14). Detailed routing resolves
#   local overflow, and the routing DRC checker fails the run if it cannot.
GRT_ALLOW_CONGESTION: true

# rst_i is asynchronous (false path); the rest is LibreLane's base.sdc.
# (dir:: is the design dir, syn/build/asic, not this file's folder.)
PNR_SDC_FILE: dir::../../asic_soc.sdc
SIGNOFF_SDC_FILE: dir::../../asic_soc.sdc
# Post-GRT design repair (slew/cap) stays off: OpenRAM's .lib gives addr0,
# addr1 and wmask0 a 40 ps max transition, which is only the last index of
# its characterization table (the setup values are flat across it). No sky130
# driver reaches it (best 68 ps), and repair_design stops on RSZ-0090
# (2026-11-13). The signoff slew checker still lists those SRAM pins.
RUN_POST_GRT_DESIGN_REPAIR: false

# Magic's stream-out leaves 24 OpenRAM subcells (bank, control_logic_*, ...) as
# extra top cells beside asic_top (the PDK's macro GDS have one top each);
# KLayout's has asic_top alone. KLayout's GDS is the deliverable; Magic's is
# still written and KLayout.XOR checks both agree under asic_top.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Signoff on a 6 x 5 mm die with 48 SRAMs, within WSL's 31 GB:
# KLayout XOR defaults to one thread per CPU. Magic DRC is the DRC signoff: it
# runs on the GDS with the two SRAMs read first as maglef black boxes, so
# every standard cell is checked with its devices and taps and the SRAM
# internals (the PDK's macros) are not re-checked. KLayout DRC is off: on the
# full GDS it passed 11 GB and ran WSL's 31 GB out (2026-11-12). Magic on the
# DEF view instead is no check: its cells come from LEF, which has N-well but
# no tap diffusion, so it flagged 14,181 nwell.4 "no N+ tap" boxes on rows
# that do hold tap cells (2026-11-12).
# Magic.WriteLEF and the antenna check of its LEF are skipped (make asic SOC=1
# passes --skip): they only matter if asic_top is reused as a macro, and the
# LEF write merges every shape on the die (out of memory, 2026-11-12).
KLAYOUT_XOR_THREADS: 4
RUN_KLAYOUT_DRC: false
MAGIC_DRC_USE_GDS: true
MAGIC_DRC_MAGLEFS:
  - pdk_dir::libs.ref/sky130_sram_macros/maglef/sky130_sram_2kbyte_1rw1r_32x512_8.mag
  - pdk_dir::libs.ref/sky130_sram_macros/maglef/sky130_sram_1kbyte_1rw1r_32x256_8.mag
