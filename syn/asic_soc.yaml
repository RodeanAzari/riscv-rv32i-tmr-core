# LibreLane RTL-to-GDSII of the full SoC, Sky130 (CLAUDE.md §6.4, run #2).
# Run with `make asic SOC=1`, which supplies VERILOG_FILES (every .sv under
# rtl/, found recursively) and runs this inside LibreLane's nix-shell.
#
# rtl/top/asic_top.sv: the SoC as the board builds it by default (single
# core, RV32I, array on the core clock) with a chip's pins. Its 80 KiB of
# RAM are 48 OpenRAM macros (ram_dp.sv under SKY130_SRAM): main RAM 16 x
# 2 KiB, the accelerator's A and W buffers 8 x 2 KiB each, C 16 x 1 KiB.

DESIGN_NAME: asic_top
CLOCK_PORT: clk_i

# As run #1: slang reads every .sv under rtl/ and elaborates DESIGN_NAME's
# hierarchy only.
USE_SLANG: true
VERILOG_DEFINES:
  - SKY130_SRAM

# 50 ns (20 MHz), asic_top's CLK_HZ. 40 ns failed setup at ss after routing
# (-2.7 ns, 2026-11-14): OpenRAM's model launches read data on the falling
# edge, so SRAM -> flop paths get half a period, and the SRAMs sit mm from
# the read mux (16 repeaters on dout). 22.9 ns of that path at max_ss.
CLOCK_PERIOD: 50

# As run #1: no clock delay cells used as buffers.
EXTRA_EXCLUDED_CELLS:
  - sky130_fd_sc_hd__clkdlybuf4s*

# The macros come with one liberty, typical (TT 1.8 V 25 C): it times every
# corner, so ss and ff numbers for paths through a macro are typical inside
# the macro. A limitation of the PDK's OpenRAM views.
