# riscv-formal configuration for riscv_core built with M_EXT (Phase H). As
# checks.cfg, plus the 8 M instructions, under RISCV_FORMAL_ALTOPS: the core
# reports riscv-formal's stand-in values for M (a sum or difference XORed
# with a mask) with the real latency and stall; the real arithmetic is
# proven on the unit alone (tb/formal/muldiv.sby).
#
# Depths: a divide is 34 cycles in EX, so it first retires about 40 cycles
# after reset -- insn checks for DIV/REM at 45, MUL at 20 (3 cycles in EX).
# causal reaches 45 so it sees divides retire. reg stays at RV32I's 25 (sees
# MUL retire, not DIV): at 45 one solver call ran 8 h on boolector and 30 min
# on bitwuzla without an answer (2026-11-07). A divide's result leaves EX by
# the same path as a multiply's (md_value), insn_div* run at 45, and core.sby
# proves its operands (F1/F2) and stall (M2) for any latency. liveness allows 40
# cycles between retirements (one divide) instead of 20; hang allows 45
# cycles to the first retirement (a divide straight after reset: it failed
# at 10 on 2026-11-06, a REMU still in EX).

[options]
isa rv32im

[depth]
insn            15
insn_(mul|mulh|mulhsu|mulhu) 20
insn_(div|divu|rem|remu) 45
reg        15   25
pc_fwd     10   25
pc_bwd     10   25
unique      1 10 25
causal     10   45
causal_mem 10   25
liveness    1 10 50
hang        1   45
ill             15

[defines]
# Memory fields are reported lane-style (word address + byte masks), and a
# misaligned access traps -- exactly what this mode specifies (docs/rvfi-plan.md).
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RVF_M_EXT 1'b1

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/rtl/riscv_alu.sv
@basedir@/cores/@core@/rtl/riscv_branch.sv
@basedir@/cores/@core@/rtl/riscv_core.sv
@basedir@/cores/@core@/rtl/riscv_decoder.sv
@basedir@/cores/@core@/rtl/riscv_hazard.sv
@basedir@/cores/@core@/rtl/riscv_mem_align.sv
@basedir@/cores/@core@/rtl/riscv_muldiv.sv
@basedir@/cores/@core@/rtl/riscv_regfile.sv
