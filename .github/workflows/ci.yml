name: CI

on:
  push:
  pull_request:

env:
  # cocotb 2.x requires Verilator >= 5.036, newer than any apt package,
  # so it is built from source and cached on this key.
  VERILATOR_VERSION: v5.050

jobs:
  verilate:
    runs-on: ubuntu-latest
    steps:
      # The official test suite is a submodule pinned to one commit.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison flex g++ help2man libfl-dev make perl zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: |
          echo "$HOME/verilator-install/bin" >> "$GITHUB_PATH"

      - name: Report Verilator version
        run: verilator --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Assembles riscv-tests. Ubuntu packages a riscv64 toolchain, not a
      # riscv32 one; it builds RV32I just the same, because -march=rv32i
      # -mabi=ilp32 pick the target and these tests link no libraries.
      # test_riscv_tests.py finds it on PATH.
      - name: Install RISC-V assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf

      - name: Install cocotb
        run: pip install -r tb/cocotb/requirements.txt

      - name: Lint RTL
        run: make lint

      - name: Run regression
        run: make sim

      # make formal joins this job in Phase B. yosys and SymbiYosys install in
      # a couple of minutes on a hosted runner, unlike Vivado -- see CLAUDE.md
      # section 4 for why synthesis stays local with committed reports.
