name: CI

on:
  push:
  pull_request:

env:
  # cocotb 2.x requires Verilator >= 5.036, newer than any apt package,
  # so it is built from source and cached on this key.
  VERILATOR_VERSION: v5.050
  # Yosys, SymbiYosys and the solvers, as one bundle. A nightly, so its date
  # is its version: keep it equal to the local install (docs/PROGRESS.md,
  # Toolchain) so CI proves with exactly the tools used to write the proofs.
  OSS_CAD_SUITE_DATE: 2026-10-07

jobs:
  verilate:
    runs-on: ubuntu-24.04
    steps:
      # The official test suite is a submodule pinned to one commit.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-install
          key: verilator-${{ runner.os }}-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison flex g++ help2man libfl-dev make perl zlib1g-dev
          git clone --depth 1 --branch "$VERILATOR_VERSION" \
            https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: |
          echo "$HOME/verilator-install/bin" >> "$GITHUB_PATH"

      - name: Report Verilator version
        run: verilator --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Assembles riscv-tests and builds the SoC firmware and CoreMark.
      # Ubuntu packages a riscv64 toolchain, not a riscv32 one; it builds
      # RV32I just the same, because -march=rv32i -mabi=ilp32 pick the
      # target. CoreMark also links libgcc, from the package's rv32i/ilp32
      # multilib. test_riscv_tests.py finds it on PATH.
      - name: Install RISC-V assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf

      - name: Install cocotb
        run: pip install -r tb/cocotb/requirements.txt

      - name: Lint RTL
        run: make lint

      - name: Run regression
        run: make sim

  # Formal runs as its own job, in parallel with lint + sim, so a failure in
  # one never hides the other's result. yosys and SymbiYosys install in about
  # a minute on a hosted runner, unlike Vivado -- see CLAUDE.md section 4 for
  # why synthesis stays local with committed reports.
  formal:
    runs-on: ubuntu-24.04
    steps:
      # riscv-formal is a submodule pinned to one commit.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Downloaded every run rather than cached: a GitHub-to-GitHub transfer
      # of ~700 MB takes seconds, and caching it would spend a large share of
      # the repository's 10 GB cache quota to save them.
      - name: Install OSS CAD Suite
        run: |
          tag="$OSS_CAD_SUITE_DATE"
          file="oss-cad-suite-linux-x64-${tag//-/}.tgz"
          curl -fsSL -o /tmp/oss-cad-suite.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$tag/$file"
          tar -xzf /tmp/oss-cad-suite.tgz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: |
          yosys -V
          sby --help | head -1

      - name: Formal verification
        run: make formal
